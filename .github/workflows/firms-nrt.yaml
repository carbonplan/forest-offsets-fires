name: firms-nrt

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *' # every 6th hour
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  build-firms-tiles:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS2_MAP_KEY }}
      AWS_DEFAULT_REGION: us-west-2

    timeout-minutes: 240
    container:
      image: quay.io/carbonplan/forest-offsets-fires:latest
      options: --user root

    steps:
      - uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::631969445205:role/gha-forest-offsets-fires
          aws-region: us-west-2

      - name: Install
        run: |
          git config --global --add safe.directory /__w/forest-offsets-fires/forest-offsets-fires
          python -m pip install .
          python -m pip list

      - name: Generate vector tiles
        run: |
          python scripts/generate_firms_tiles.py
